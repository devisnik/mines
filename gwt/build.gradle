plugins {
    id "org.docstr.gwt" version "2.2.9"
}

// needed to avoid crash in gwt-closure below due to project not resolved
evaluationDependsOn(':robot')
evaluationDependsOn(':model')

dependencies {
	implementation project(':robot')
	implementation project(':model')
}

gwt {
//    gwtVersion='2.8.2'
//    minHeapSize = '512M'
//    maxHeapSize = '4096M'

    modules = ['de.devisnik.web.Mines']
    extraSourceDirs = files(
        files(project(':model').sourceSets.main.allJava.srcDirs).asPath,
        files(project(':model').sourceSets.main.output.resourcesDir).asPath,
        files(project(':robot').sourceSets.main.allJava.srcDirs).asPath,
        files(project(':robot').sourceSets.main.output.resourcesDir).asPath
    )

    devMode {
        startupUrl = 'de.devisnik.web.Mines/Mines.html'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
